name: Publish Lambda Image to ECR

on:
  push:
    branches: [migration/lambda-clean]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: lambda-ecr-publish
  cancel-in-progress: true

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: ai-intelligence-hub-lambda

jobs:
  publish:
    name: Build and push Lambda image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::315250444028:role/ai-hub-github-ecr-role
          role-session-name: ai-hub-ecr-publish
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: "315250444028"

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image URI
        id: image
        run: |
          echo "uri=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Build and push Lambda image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/lambda/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.uri }}

      - name: Resolve published image digest
        id: digest
        env:
          BUILD_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          test -n "$BUILD_DIGEST"
          echo "digest=$BUILD_DIGEST" >> "$GITHUB_OUTPUT"
          echo "Published digest: $BUILD_DIGEST"

      - name: Deploy API Lambda
        env:
          FUNCTION_NAME: ai-hub-api
          IMAGE_URI: ${{ steps.image.outputs.uri }}
        run: |
          aws lambda update-function-code \
            --function-name "$FUNCTION_NAME" \
            --image-uri "$IMAGE_URI" \
            --publish

      - name: Deploy digest Lambda
        env:
          FUNCTION_NAME: ai-hub-digest
          IMAGE_URI: ${{ steps.image.outputs.uri }}
        run: |
          aws lambda update-function-code \
            --function-name "$FUNCTION_NAME" \
            --image-uri "$IMAGE_URI" \
            --publish

      - name: Wait for Lambda deployments
        run: |
          aws lambda wait function-updated-v2 --function-name ai-hub-api
          aws lambda wait function-updated-v2 --function-name ai-hub-digest

      - name: Verify Lambda image digests
        env:
          EXPECTED_DIGEST: ${{ steps.digest.outputs.digest }}
        run: |
          for FUNCTION_NAME in ai-hub-api ai-hub-digest; do
            ACTUAL_URI="$(aws lambda get-function \
              --function-name "$FUNCTION_NAME" \
              --query 'Code.ResolvedImageUri' \
              --output text)"
            ACTUAL_DIGEST="${ACTUAL_URI##*@}"
            STATE="$(aws lambda get-function \
              --function-name "$FUNCTION_NAME" \
              --query 'Configuration.State' \
              --output text)"

            echo "$FUNCTION_NAME state=$STATE resolved_image=$ACTUAL_URI"

            test "$STATE" = "Active"
            test "$ACTUAL_DIGEST" = "$EXPECTED_DIGEST"
          done

      - name: Show published image
        run: echo "Published and deployed ${{ steps.image.outputs.uri }}"
