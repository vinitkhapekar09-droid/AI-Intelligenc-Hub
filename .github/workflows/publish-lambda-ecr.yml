name: Publish Lambda Image to ECR

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: ai-intelligence-hub-lambda

jobs:
  publish:
    name: Build and push Lambda image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::315250444028:role/ai-hub-github-ecr-role
          role-session-name: ai-hub-ecr-publish
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: "315250444028"

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image URI
        id: image
        run: |
          echo "uri=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Build and push Lambda image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/lambda/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.uri }}

      - name: Show published image
        run: echo "Published ${{ steps.image.outputs.uri }}"
