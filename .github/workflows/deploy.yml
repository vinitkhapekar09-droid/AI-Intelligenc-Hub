name: Deploy to AWS EC2

on:
  push:
    branches: [main]

# Serialize GitHub Actions deployments.
concurrency:
  group: ec2-deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy via SSH
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ${{ secrets.EC2_SSH_USER }}@${{ secrets.EC2_HOST }} "
            set -euo pipefail
            exec 9>/tmp/ai_explore_deploy.lock
            flock 9
            cd \"${{ secrets.EC2_APP_DIR || '/opt/ai-intelligence-hub' }}\"
            git fetch origin main
            git reset --hard origin/main
            docker compose -f docker-compose.prod.yml down --remove-orphans
            docker compose -f docker-compose.prod.yml up -d --build --remove-orphans --force-recreate
            docker image prune -f
            docker compose -f docker-compose.prod.yml ps
            echo Deploy complete
          "
